    Staff:
      type: object
      description: One staff member as their institution's administrators see them.
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/StaffRoleEnum'
          readOnly: true
        job_title:
          type: string
          readOnly: true
          description: e.g. Doctor, Police officer. Shown only; not a permission.
