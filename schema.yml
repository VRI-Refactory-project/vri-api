      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageInterpreterDetail'
          description: ''
        '400':
          description: Not allowed from the interpreter's current status, or a field
            is missing.
        '404':
          description: No interpreter with this id.
  /api/v1/manage/users/{id}/reset-password/confirm/:
    post:
      operationId: manage_users_reset_password_confirm_create
      description: |-
        Admin step 2: enter the code from your email and a temporary password/PIN for the user.

        The user must change it at their next sign-in (`must_change_password` = true).
      summary: 'Admin reset: confirm code and set a temporary password'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/manage/users/{id}/reset-password/request/:
    post:
      operationId: manage_users_reset_password_request_create
      description: |-
        Admin step 1: send a confirmation code to the ADMIN's own email.

        Verify the user's identity offline first (see docs/design/V2-008-account-recovery.md).
      summary: 'Admin reset: email me a confirmation code'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Manage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
