      - created_at
      - email
      - full_name
      - id
      - job_title
      - last_login
      - phone_number
      - revoked_at
      - role
      - status
      - user_id
    StaffCreateRequest:
      type: object
      description: |-
        An institution administrator adds a staff member (V2-006).

        Same checks as registration for name, phone and email (email is required: the login details are sent
        there). No password: a temporary one is emailed. Needs `institution` and `request` in the context.
        `save()` returns the new InstitutionStaff.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        job_title:
          type: string
          default: ''
          maxLength: 100
        role:
          allOf:
          - $ref: '#/components/schemas/StaffRoleEnum'
          default: STAFF
      required:
      - email
      - full_name
      - phone_number
    StaffRoleEnum:
      enum:
      - ADMIN
      - STAFF
      type: string
      description: |-
        * `ADMIN` - Institution administrator
        * `STAFF` - Institutional user
    StatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
