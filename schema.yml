          description: ''
  /api/v1/interpreters/me/availability/days/{day}/:
    patch:
      operationId: interpreters_me_availability_days_partial_update
      description: |-
        Saves one day from the schedule screen. The date is in the URL (YYYY-MM-DD).

        - `repeat_weekly: false` (default): changes only that date.
        - `repeat_weekly: true`: changes that weekday in the default week, so every future week uses it (a change saved earlier for this one date is removed).
        - `is_available: false` means unavailable all day (times are ignored).

        Past dates cannot be changed. The change applies to the very next routing decision.
      summary: Save the availability for one day
      parameters:
      - in: path
        name: day
        schema:
          type: string
        required: true
      tags:
      - Interpreter Availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDayUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDayUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDayUpdateRequest'
      security:
      - jwtAuth: []
