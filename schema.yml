      description: 'The dots on the Exceptions calendar. month is YYYY-MM (default:
        this month). kind is ''unavailable'' (unavailable all day) or ''modified_hours''.
        To add or edit a date, use PATCH .../days/<date>/ with repeat_weekly false.'
