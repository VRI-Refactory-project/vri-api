      - password_last_changed
      - updated_at
    AdminProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone_number:
          type: string
          default: ''
        profile_photo:
          type: string
          format: binary
          nullable: true
        session_alerts:
          type: boolean
          description: Receive alerts for connection failures & sessions needing attention.
        verification_alerts:
          type: boolean
          description: Receive alerts for new interpreter & institution applications.
    AdminResetConfirmRequest:
