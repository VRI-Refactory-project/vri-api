openapi: 3.0.3
info:
  title: SignConnect VRI API
  version: 0.1.0
  description: Backend API for the SignConnect Video Remote Interpreting platform.
paths:
  /api/v1/administration/change-password/:
    post:
      operationId: administration_change_password_create
      description: Update admin password and record the password_last_changed timestamp
        (V2-052).
      summary: Change administrator password
      tags:
      - Administration Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/administration/settings/:
    get:
      operationId: administration_settings_retrieve
      description: View and update admin details, notification preferences, and contact
        info (V2-052).
      summary: Retrieve or update administrator profile and settings
      tags:
      - Administration Settings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    put:
      operationId: administration_settings_update
      description: View and update admin details, notification preferences, and contact
        info (V2-052).
      summary: Retrieve or update administrator profile and settings
      tags:
      - Administration Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
    patch:
      operationId: administration_settings_partial_update
      description: View and update admin details, notification preferences, and contact
        info (V2-052).
      summary: Retrieve or update administrator profile and settings
      tags:
      - Administration Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
          description: ''
  /api/v1/api/availability/base/:
    get:
      operationId: api_availability_base_list
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaseAvailability'
          description: ''
    post:
      operationId: api_availability_base_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseAvailabilityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BaseAvailabilityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BaseAvailabilityRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAvailability'
          description: ''
  /api/v1/api/availability/base/{id}/:
    get:
      operationId: api_availability_base_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAvailability'
          description: ''
    put:
      operationId: api_availability_base_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseAvailabilityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BaseAvailabilityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BaseAvailabilityRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAvailability'
          description: ''
    patch:
      operationId: api_availability_base_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBaseAvailabilityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBaseAvailabilityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBaseAvailabilityRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseAvailability'
          description: ''
    delete:
      operationId: api_availability_base_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/api/availability/overrides/:
    get:
      operationId: api_availability_overrides_list
      description: Retrieve all calendar overrides/exceptions (vacations, specific
        shifts) for the user.
      summary: List availability overrides
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityOverride'
          description: ''
    post:
      operationId: api_availability_overrides_create
      description: Block out a specific date or open a specific time exception.
      summary: Create an availability override
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityOverrideRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvailabilityOverrideRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvailabilityOverrideRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityOverride'
          description: ''
  /api/v1/api/availability/overrides/{id}/:
    get:
      operationId: api_availability_overrides_retrieve
      summary: Get details of an override slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityOverride'
          description: ''
    put:
      operationId: api_availability_overrides_update
      summary: Update an override slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityOverrideRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvailabilityOverrideRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvailabilityOverrideRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityOverride'
          description: ''
    patch:
      operationId: api_availability_overrides_partial_update
      summary: Partially update an override slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAvailabilityOverrideRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAvailabilityOverrideRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAvailabilityOverrideRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityOverride'
          description: ''
    delete:
      operationId: api_availability_overrides_destroy
      summary: Delete an override slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/deaf-user/me/:
    get:
      operationId: auth_deaf_user_me_retrieve
      description: Retrieve or update details for the authenticated Deaf user, including
        emergency contact information, sign language preferences, and sensory accessibility
        settings.
      summary: Deaf User Profile Management
      tags:
      - User Management
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: auth_deaf_user_me_update
      description: Retrieve or update details for the authenticated Deaf user, including
        emergency contact information, sign language preferences, and sensory accessibility
        settings.
      summary: Deaf User Profile Management
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_deaf_user_me_partial_update
      description: Retrieve or update details for the authenticated Deaf user, including
        emergency contact information, sign language preferences, and sensory accessibility
        settings.
      summary: Deaf User Profile Management
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend_create
      description: Send a new verification code to the signed-in user's email.
      summary: 'Email verification: send me a new code'
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: Enter the 6-digit code from the email. On success the email is
        marked verified.
      summary: 'Email verification: confirm the code'
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Sign in with phone number or email plus password/PIN. Returns JWT tokens.

        Send the access token on later requests as: `Authorization: Bearer <access>`.
      summary: Sign in (phone or email)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              WithPhone:
                value:
                  identifier: '0772123456'
                  password: your-password
                summary: With phone
              WithEmail:
                value:
                  identifier: sarah@example.com
                  password: your-password
                summary: With email
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Current signed-in user
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/me/access/{role}/:
    get:
      operationId: auth_me_access_retrieve
      description: |-
        Checks whether the signed-in user may use endpoints limited to `role`.

        It runs the same permission class that protects those endpoints (apps/core/permissions.py), so
        clients can confirm access before routing, and the 401/403 rules can be tried in Swagger.
      summary: Check access to a role's endpoints
      parameters:
      - in: path
        name: role
        schema:
          type: string
          enum:
          - admin
          - deaf_hoh
          - institution
          - interpreter
        required: true
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAccess'
          description: ''
        '401':
          description: Not signed in.
        '403':
          description: Signed in with a different role.
        '404':
          description: Unknown role.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change your own password/PIN. Clears `must_change_password` and
        signs out other devices.
      summary: Change my password/PIN
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/recovery/confirm/:
    post:
      operationId: auth_recovery_confirm_create
      description: 'Step 2: send the code and a new password/PIN. On success the user
        is signed in.'
      summary: 'Account recovery: confirm code and set new password'
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecoveryConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/recovery/request/:
    post:
      operationId: auth_recovery_request_create
      description: |-
        Step 1: ask for a recovery code by email.

        Always returns the same 200 response, whether or not the account exists, so this endpoint
        cannot be used to find out who is registered.
      summary: 'Account recovery: request a code by email'
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecoveryRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Registers a new web user account using email, password, and optional
        contact number.
      summary: User Registration
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/auth/register/deaf/:
    post:
      operationId: auth_register_deaf_create
      description: Creates an account for one role and signs the user in (returns
        the same payload as login).
      summary: Register a Deaf / Hard of Hearing user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeafRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeafRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeafRegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/register/institution/:
    post:
      operationId: auth_register_institution_create
      description: Creates an account for one role and signs the user in (returns
        the same payload as login).
      summary: Register an institution (the registrant becomes its administrator;
        pending approval)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InstitutionRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InstitutionRegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/register/interpreter/:
    post:
      operationId: auth_register_interpreter_create
      description: Creates an account for one role and signs the user in (returns
        the same payload as login).
      summary: Register an interpreter (account starts pending review)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpreterRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterpreterRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterpreterRegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/roles/:
    get:
      operationId: auth_roles_list
      description: |-
        The account types shown on the role selection screen. The chosen `value` decides which
        registration form the user is sent to. Admin accounts are created by staff only, so they are not listed.
      summary: Roles a new user can choose
      tags:
      - Auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleOption'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Get a new access token from a refresh token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/dashboard/admin/:
    get:
      operationId: dashboard_admin_retrieve
      description: Summary numbers and latest administrator sign-ins.
      summary: Administrator dashboard
      tags:
      - Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/dashboard/deaf/:
    get:
      operationId: dashboard_deaf_retrieve
      description: Everything the Deaf user's home screen needs in one request.
      summary: Deaf user dashboard
      tags:
      - Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeafDashboard'
          description: ''
  /api/v1/dashboard/interpreter/:
    get:
      operationId: dashboard_interpreter_retrieve
      description: Dashboard data for active, approved interpreters.
      summary: Interpreter dashboard
      tags:
      - Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpreterDashboard'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Confirms the API is up and can reach the database.
      summary: Health check
      tags:
      - Health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/institutions/{id}/approve/:
    post:
      operationId: institutions_approve_create
      summary: Approve a pending institution application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Institutions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionApplication'
          description: ''
  /api/v1/institutions/{id}/reject/:
    post:
      operationId: institutions_reject_create
      summary: Reject a pending institution application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Institutions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionApplication'
          description: ''
  /api/v1/institutions/api/institution/account/:
