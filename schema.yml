          type: string
          readOnly: true
          description: ACTIVE or REVOKED.
        last_login:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
