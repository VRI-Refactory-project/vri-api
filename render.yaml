# Render Blueprint for the free demo backend. Database: Neon (see DEPLOY.md), set DATABASE_URL by hand.
services:
  - type: web
    name: signconnect-api
    runtime: docker
    plan: free
    region: virginia # same region as the Neon database (AWS us-east-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    dockerCommand: sh ./start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.staging
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: NUM_PROXIES
        value: "1"
      - key: PYTHON_UNBUFFERED
        value: "1"
