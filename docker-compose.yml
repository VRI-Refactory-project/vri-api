

services:
  db:
    image: postgres:15-alpine
    container_name: vri_postgres_db
    restart: always
    environment:
      - POSTGRES_DB=vri_uganda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secure_dev_password_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vri_uganda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: vri_django_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: